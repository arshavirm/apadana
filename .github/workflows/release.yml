name: Build and Attach .deb to Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

env:
  APP_NAME: Apadana        
  ENTRY_FILE: src/main.py
  MAINTAINER: "Arshavir Mirzakhani"

permissions:
  contents: write   

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk dpkg-dev fakeroot binutils

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compute package version from release tag
        id: version
        run: |
          RAW_TAG="${{ github.event.release.tag_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build standalone Linux executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "${{ env.APP_NAME }}" "${{ env.ENTRY_FILE }}"

      - name: Verify binary was produced
        run: |
          test -f "dist/${{ env.APP_NAME }}"
          file "dist/${{ env.APP_NAME }}"

      - name: Assemble .deb package tree
        run: |
          set -eux
          PKG_ROOT="pkgroot"
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT/usr/bin"
          mkdir -p "$PKG_ROOT/usr/share/applications"

          cp "dist/${{ env.APP_NAME }}" "$PKG_ROOT/usr/bin/${{ env.APP_NAME }}"
          chmod 0755 "$PKG_ROOT/usr/bin/${{ env.APP_NAME }}"

          cat > "$PKG_ROOT/usr/share/applications/${{ env.APP_NAME }}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Software Manager
          Comment=Install, remove, and upgrade apt packages
          Exec=/usr/bin/${{ env.APP_NAME }}
          Icon=utilities-terminal
          Terminal=false
          Categories=System;PackageManager;
          EOF

          SIZE_KB=$(du -sk "$PKG_ROOT/usr" | cut -f1)
          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: ${{ env.APP_NAME }}
          Version: ${VERSION}
          Section: admin
          Priority: optional
          Architecture: amd64
          Installed-Size: ${SIZE_KB}
          Depends: policykit-1
          Maintainer: ${{ env.MAINTAINER }}
          Description: Graphical apt package manager
           A simple Tkinter GUI for browsing, installing, removing, and
           upgrading apt packages without using the terminal.
          EOF

      - name: Build .deb package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEB_FILE="${{ env.APP_NAME }}_${VERSION}_amd64.deb"
          dpkg-deb --root-owner-group --build pkgroot "$DEB_FILE"
          echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Sanity-check the package with lintian (non-blocking)
        run: |
          sudo apt-get install -y lintian || true
          lintian "$DEB_FILE" || true

      - name: Rename binary for a clearer release asset name
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BIN_ASSET="${{ env.APP_NAME }}-${VERSION}-linux-amd64"
          cp "dist/${{ env.APP_NAME }}" "$BIN_ASSET"
          echo "BIN_ASSET=$BIN_ASSET" >> "$GITHUB_ENV"

      - name: Upload .deb and binary to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ env.DEB_FILE }}
            ${{ env.BIN_ASSET }}