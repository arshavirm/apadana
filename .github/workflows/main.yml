name: Build Linux .deb package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  APP_NAME: Apadana        
  ENTRY_FILE: src/main.py
  MAINTAINER: "Arshavir Mirzakhani"

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk dpkg-dev fakeroot binutils

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute package version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="0.1.${{ github.run_number }}+${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build standalone Linux executable with PyInstaller
        run: |
          pyinstaller --onefile --add-data="src/logo.png:src" --windowed --name "${{ env.APP_NAME }}" "${{ env.ENTRY_FILE }}"

      - name: Verify binary was produced
        run: |
          test -f "dist/${{ env.APP_NAME }}"
          file "dist/${{ env.APP_NAME }}"

      - name: Assemble .deb package tree
        run: |
          set -eux
          PKG_ROOT="pkgroot"
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT/usr/bin"
          mkdir -p "$PKG_ROOT/usr/share/applications"

          # Binary
          cp "dist/${{ env.APP_NAME }}" "$PKG_ROOT/usr/bin/${{ env.APP_NAME }}"
          chmod 0755 "$PKG_ROOT/usr/bin/${{ env.APP_NAME }}"

          # Desktop launcher entry
          cat > "$PKG_ROOT/usr/share/applications/${{ env.APP_NAME }}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Apadana
          Comment=a small graphical front end for apt
          Exec=/usr/bin/${{ env.APP_NAME }}
          Icon=utilities-terminal
          Terminal=false
          Categories=System;PackageManager;
          EOF

          SIZE_KB=$(du -sk "$PKG_ROOT/usr" | cut -f1)
          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: ${{ env.APP_NAME }}
          Version: ${VERSION}
          Section: admin
          Priority: optional
          Architecture: amd64
          Installed-Size: ${SIZE_KB}
          Maintainer: ${{ env.MAINTAINER }}
          Description: a small graphical front end for apt
          EOF

      - name: Build .deb package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEB_FILE="${{ env.APP_NAME }}_${VERSION}_amd64.deb"
          dpkg-deb --root-owner-group --build pkgroot "$DEB_FILE"
          echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Sanity-check the package with lintian (non-blocking)
        run: |
          sudo apt-get install -y lintian || true
          lintian "$DEB_FILE" || true

      - name: Upload .deb as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-deb-${{ github.sha }}
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone binary as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-binary-${{ github.sha }}
          path: dist/${{ env.APP_NAME }}
          if-no-files-found: error
          retention-days: 30
